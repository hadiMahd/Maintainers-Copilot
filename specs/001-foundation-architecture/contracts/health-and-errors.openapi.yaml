openapi: 3.1.0
info:
  title: Maintainer's Copilot Foundation API
  version: 0.1.0
  description: Phase 1 contract for health checks and structured errors.
paths:
  /health/live:
    get:
      summary: Liveness check
      description: Confirms the backend process is alive without checking dependencies.
      operationId: getLiveHealth
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      summary: Readiness check
      description: Reports shallow readiness for configured local dependencies.
      operationId: getReadyHealth
      responses:
        "200":
          description: Service is ready.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is not ready.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - service
        - checks
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        service:
          type: string
        version:
          type: string
        request_id:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"
    ReadinessCheck:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, degraded, unavailable]
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
