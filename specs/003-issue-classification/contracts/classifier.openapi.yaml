openapi: 3.1.0
info:
  title: Maintainer's Copilot Classifier Model Server
  version: 0.1.0
  description: Phase 3 classifier inference contract.
paths:
  /classifier/predict:
    post:
      summary: Predict issue label
      description: Returns a typed issue classification using the classifier artifact loaded during model-server lifespan.
      operationId: predictIssueLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifierRequest"
      responses:
        "200":
          description: Classifier prediction.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifierPrediction"
        "422":
          description: Invalid classifier input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Classifier model unavailable, missing, invalid, or hash-mismatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected internal failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ClassifierRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
        body:
          type: string
          minLength: 1
          maxLength: 16000
        comments:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 4000
      anyOf:
        - required: [title]
        - required: [body]
        - required: [comments]
    ClassifierPrediction:
      type: object
      required:
        - label
        - model_version
      additionalProperties: false
      properties:
        label:
          type: string
          enum: [bug, feature, docs, question]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        model_version:
          type: string
          pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:[-+][A-Za-z0-9.-]+)?$"
        request_id:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - invalid_classifier_input
            - classifier_model_unavailable
            - internal_error
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
          properties:
            reason:
              type: string
              enum:
                - missing_artifact
                - invalid_artifact
                - hash_mismatch
                - startup_load_failed
