openapi: 3.1.0
info:
  title: Maintainer's Copilot Chat API
  version: 0.1.0
  description: Phase 7 authenticated single tool-calling chatbot contract.
paths:
  /chat:
    post:
      summary: Send an authenticated chat message
      operationId: chatWithMaintainerCopilot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Streaming chat response.
          headers:
            X-Request-ID:
              schema:
                type: string
            X-Trace-ID:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid chat input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Chatbot timeout before a stream could be established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChatRequest:
      type: object
      required: [conversation_id, message]
      properties:
        conversation_id:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        stream:
          type: boolean
          default: true
        metadata:
          type: object
          additionalProperties: true
    ChatStreamEvent:
      type: object
      required: [event_type, conversation_id, sequence]
      properties:
        event_type:
          type: string
          enum: [message_delta, tool_status, warning, error, done]
        conversation_id:
          type: string
        message_id:
          type: string
        sequence:
          type: integer
          minimum: 0
        content:
          type: string
        trace_id:
          type: string
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorResponse:
      type: object
      required: [error_code, message, request_id]
      properties:
        error_code:
          type: string
          enum:
            - authentication_required
            - invalid_chat_input
            - request_too_large
            - context_limit_exceeded
            - max_tool_calls_exceeded
            - recursion_limit_exceeded
            - chatbot_timeout
            - llm_unavailable
            - tool_execution_failed
            - tracing_failed
            - internal_error
        message:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - authentication_required
            - invalid_chat_input
            - request_too_large
            - context_limit_exceeded
            - max_tool_calls_exceeded
            - recursion_limit_exceeded
            - chatbot_timeout
            - llm_unavailable
            - tool_execution_failed
            - tracing_failed
            - internal_error
        message:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        details:
          type: object
          additionalProperties: true
