openapi: 3.1.0
info:
  title: Maintainer's Copilot Auth, Memory, and Audit API
  version: 0.1.0
  description: Phase 6 authentication, authorization, memory, and audit logging contract.
paths:
  /auth/register:
    post:
      summary: Register a regular user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "409":
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid registration input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      summary: Log in and issue tokens
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Signing key unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Refresh token invalid, expired, revoked, or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/me:
    get:
      summary: Read current authenticated user
      operationId: readCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/invitations:
    post:
      summary: Create an admin invitation
      operationId: createAdminInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInvitationCreate"
      responses:
        "201":
          description: Admin invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInvitationRead"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/invitations/accept:
    post:
      summary: Accept an admin invitation
      operationId: acceptAdminInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInvitationAccept"
      responses:
        "200":
          description: Invitation accepted and admin role granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "400":
          description: Invitation invalid, expired, revoked, or already accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /memory/short-term:
    put:
      summary: Write short-term memory for the current user
      operationId: writeShortTermMemory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortTermMemoryWrite"
      responses:
        "200":
          description: Short-term memory stored with TTL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortTermMemoryRead"
        "422":
          description: Invalid memory input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Read short-term memory for the current user
      operationId: readShortTermMemory
      security:
        - bearerAuth: []
      parameters:
        - name: conversation_id
          in: query
          required: true
          schema:
            type: string
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Short-term memory value or empty result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortTermMemoryRead"
  /memory/long-term:
    post:
      summary: Explicitly write long-term memory
      operationId: writeLongTermMemory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteMemoryRequest"
      responses:
        "201":
          description: Long-term memory written and audited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongTermMemoryRead"
        "422":
          description: Invalid memory input or unsupported memory type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /memory/long-term/recall:
    post:
      summary: Recall explicitly written long-term memory for the current user
      operationId: recallLongTermMemory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongTermMemoryRecallRequest"
      responses:
        "200":
          description: Matching long-term memory entries for the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LongTermMemoryRecallResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid recall input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/audit-logs:
    get:
      summary: List audit logs
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Audit log entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          minimum: 1
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    UserRead:
      type: object
      required: [id, email, role, is_active]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        is_active:
          type: boolean
    AdminInvitationCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        expires_in_seconds:
          type: integer
          minimum: 60
    AdminInvitationAccept:
      type: object
      required: [token]
      properties:
        token:
          type: string
    AdminInvitationRead:
      type: object
      required: [id, invitee_email, status, expires_at]
      properties:
        id:
          type: string
        invitee_email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expires_at:
          type: string
          format: date-time
    ShortTermMemoryWrite:
      type: object
      required: [conversation_id, key, value]
      properties:
        conversation_id:
          type: string
        key:
          type: string
        value:
          type: string
    ShortTermMemoryRead:
      type: object
      required: [conversation_id, key, value, expires_at]
      properties:
        conversation_id:
          type: string
        key:
          type: string
        value:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    WriteMemoryRequest:
      type: object
      required: [content, memory_type]
      properties:
        content:
          type: string
          minLength: 1
        memory_type:
          type: string
          enum: [episodic, semantic, procedural]
        metadata:
          type: object
          additionalProperties: true
    LongTermMemoryRead:
      type: object
      required: [id, memory_type, content, audit_log_id]
      properties:
        id:
          type: string
        memory_type:
          type: string
          enum: [episodic, semantic, procedural]
        content:
          type: string
        audit_log_id:
          type: string
    LongTermMemoryRecallRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        conversation_id:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 20
    LongTermMemoryRecallResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LongTermMemoryRead"
    AuditLogEntry:
      type: object
      required: [id, actor_user_id, action, target_type, target_id, timestamp, metadata]
      properties:
        id:
          type: string
        actor_user_id:
          type: string
        action:
          type: string
          enum:
            - memory.write
            - role.change
            - admin_invitation.create
            - widget_config.create
            - widget_config.update
            - widget_config.delete
            - conversation.delete
        target_type:
          type: string
        target_id:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_registration
            - email_already_registered
            - invalid_credentials
            - signing_key_unavailable
            - authentication_required
            - admin_required
            - invalid_invitation
            - invalid_memory_input
            - unsupported_memory_type
            - redaction_failed
            - audit_write_failed
            - internal_error
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
