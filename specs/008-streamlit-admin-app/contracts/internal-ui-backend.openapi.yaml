openapi: 3.1.0
info:
  title: Maintainer's Copilot Internal UI Backend Support API
  version: 0.1.0
  description: Phase 8 backend endpoints required by the internal Streamlit app.
paths:
  /admin/widget-configs:
    get:
      summary: List widget configurations
      operationId: listWidgetConfigs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Widget configurations visible to an admin.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WidgetConfigRead"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create widget configuration
      operationId: createWidgetConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetConfigCreate"
      responses:
        "201":
          description: Widget configuration created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfigRead"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid widget configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/widget-configs/{config_id}:
    patch:
      summary: Update widget configuration
      operationId: updateWidgetConfig
      security:
        - bearerAuth: []
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetConfigUpdate"
      responses:
        "200":
          description: Widget configuration updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfigRead"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Widget configuration not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid widget configuration update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/widget-configs/{config_id}/embed-snippet:
    get:
      summary: Get generated embed snippet
      operationId: getWidgetEmbedSnippet
      security:
        - bearerAuth: []
      parameters:
        - name: config_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated embed snippet for the widget configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedSnippetRead"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Widget configuration not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /memory/long-term:
    get:
      summary: Inspect authorized long-term memory records
      operationId: inspectLongTermMemory
      security:
        - bearerAuth: []
      parameters:
        - name: owner_user_id
          in: query
          required: false
          schema:
            type: string
          description: Optional admin-only owner filter.
        - name: memory_type
          in: query
          required: false
          schema:
            type: string
            enum: [episodic, semantic, procedural]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Authorized memory records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryInspectionResult"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requested memory scope is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WidgetConfigCreate:
      type: object
      required: [name, allowed_origins]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        allowed_origins:
          type: array
          minItems: 1
          items:
            type: string
        theme:
          type: string
          default: default
        welcome_message:
          type: string
          maxLength: 500
        is_enabled:
          type: boolean
          default: true
    WidgetConfigUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        allowed_origins:
          type: array
          minItems: 1
          items:
            type: string
        theme:
          type: string
        welcome_message:
          type: string
          maxLength: 500
        is_enabled:
          type: boolean
    WidgetConfigRead:
      type: object
      required: [id, name, allowed_origins, theme, is_enabled, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        allowed_origins:
          type: array
          items:
            type: string
        theme:
          type: string
        welcome_message:
          type: string
          nullable: true
        is_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EmbedSnippetRead:
      type: object
      required: [widget_config_id, snippet]
      properties:
        widget_config_id:
          type: string
        snippet:
          type: string
        generated_at:
          type: string
          format: date-time
    MemoryInspectionResult:
      type: object
      required: [items, scope]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryRecordRead"
        next_cursor:
          type: string
          nullable: true
        scope:
          type: string
          enum: [own, admin]
    MemoryRecordRead:
      type: object
      required: [id, memory_type, redacted_content, source, created_at]
      properties:
        id:
          type: string
        owner_user_id:
          type: string
        memory_type:
          type: string
          enum: [episodic, semantic, procedural]
        redacted_content:
          type: string
        source:
          type: string
        created_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - authentication_required
            - admin_required
            - widget_config_not_found
            - invalid_widget_config
            - invalid_memory_scope
            - internal_error
        message:
          type: string
        request_id:
          type: string
        trace_id:
          type: string
        details:
          type: object
          additionalProperties: true
