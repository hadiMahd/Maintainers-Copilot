openapi: 3.1.0
info:
  title: Maintainer's Copilot Issue Analysis Model Server
  version: 0.1.0
  description: Phase 4 NER and summarization tool contract.
paths:
  /ner:
    post:
      summary: Extract code-shaped entities from issue text
      description: Returns typed entities detected in issue title, body, and comments.
      operationId: extractIssueEntities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueAnalysisRequest"
      responses:
        "200":
          description: Extracted entities.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NerResponse"
        "422":
          description: Invalid NER input, including empty content or combined input over 8,000 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: NER tool execution failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /summarize:
    post:
      summary: Summarize issue thread content
      description: Returns a concise summary, key facts, unresolved questions, and a maintainer next step when supported.
      operationId: summarizeIssueThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummarizationRequest"
      responses:
        "200":
          description: Issue summary.
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummarizationResponse"
        "422":
          description: Invalid summarization input, including empty content or combined input over 8,000 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Summarization adapter unavailable or timed out. No fallback summary content is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Summarization tool execution failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    IssueAnalysisRequest:
      type: object
      description: >
        Combined length of title, body, and all comments must not exceed 8,000
        characters. That cross-field rule is enforced server-side.
      properties:
        title:
          type: string
          maxLength: 8000
        body:
          type: string
          maxLength: 8000
        comments:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 8000
      anyOf:
        - required: [title]
        - required: [body]
        - required: [comments]
    SummarizationRequest:
      allOf:
        - $ref: "#/components/schemas/IssueAnalysisRequest"
        - type: object
          properties:
            max_summary_sentences:
              type: integer
              minimum: 1
              maximum: 8
    NerResponse:
      type: object
      required:
        - entities
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedEntity"
        warnings:
          type: array
          items:
            type: string
        request_id:
          type: string
    ExtractedEntity:
      type: object
      required:
        - text
        - type
      properties:
        text:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/EntityType"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        span:
          $ref: "#/components/schemas/SourceSpan"
        source_field:
          type: string
          enum: [title, body, comments]
    EntityType:
      type: string
      enum:
        - file_path
        - function_name
        - class_name
        - package_name
        - version_number
        - error_code
        - url
        - stack_trace_marker
        - environment_name
        - command_snippet
    SourceSpan:
      type: object
      required:
        - source_field
        - start
        - end
      properties:
        source_field:
          type: string
          enum: [title, body, comments]
        comment_index:
          type: integer
          minimum: 0
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 1
    SummarizationResponse:
      type: object
      required:
        - summary
        - key_facts
        - unresolved_questions
      properties:
        summary:
          type: string
          minLength: 1
        key_facts:
          type: array
          items:
            type: string
        unresolved_questions:
          type: array
          items:
            type: string
        suggested_next_step:
          type: string
        limitations:
          type: array
          items:
            type: string
        request_id:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - invalid_tool_input
            - ner_extraction_failed
            - summarizer_unavailable
            - summarizer_timeout
            - tool_execution_failed
            - internal_error
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
