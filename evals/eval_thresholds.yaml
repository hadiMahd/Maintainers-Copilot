# Phase 5 RAG evaluation thresholds
# These are baseline-permissive defaults for fixture-based testing.
# Values will be tightened once real corpus evaluation runs in US3/US4.

retrieval:
  hit_at_5: 0.0
  mrr_at_10: 0.0

generation:
  faithfulness: 0.0
  answer_relevancy: 0.0

gate:
  advanced_must_beat_baseline: true
  required_metrics:
    - hit_at_5
    - mrr_at_10
