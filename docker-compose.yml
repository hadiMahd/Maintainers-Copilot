services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maintainer}
      POSTGRES_USER: ${POSTGRES_USER:-maintainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maintainer}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintainer"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"

  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "
        pip install mlflow>=2.10.0 boto3 &&
        mlflow server
        --host 0.0.0.0
        --port 5000
        --default-artifact-root s3://mlflow/artifacts
        --backend-store-uri sqlite:///mlflow.db
      "
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "5000:5000"

  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8200:8200"

  vault_seed:
    build:
      context: ./
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+asyncpg://maintainer:maintainer@postgres:5432/maintainer}
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
      APP_MINIO_ENDPOINT: ${APP_MINIO_ENDPOINT:-minio:9000}
      APP_MINIO_ACCESS_KEY: ${APP_MINIO_ACCESS_KEY:-minioadmin}
      APP_MINIO_SECRET_KEY: ${APP_MINIO_SECRET_KEY:-minioadmin}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-jwt-bootstrap-only}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:-}
      AZURE_EMBEDDING_MODEL: ${AZURE_EMBEDDING_MODEL:-text-embedding-3-small}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-week-7-copilot}
    command:
      [
        "uv",
        "run",
        "python",
        "scripts/seed_vault_from_env.py",
        "--from-env",
        "--timeout",
        "60",
      ]
    restart: "no"

  migrations:
    build:
      context: ./
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql+asyncpg://maintainer:maintainer@postgres:5432/maintainer}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault_seed:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully
      model_server:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
      CHAT_MODEL_SERVER_BASE_URL: http://model_server:8001
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      HF_TOKEN: ${HUGGINGFACE_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_TOKEN:-}
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: ./
    profiles:
      - ui
    depends_on:
      backend:
        condition: service_started
    environment:
      MAINTAINER_COPILOT_UI_BASE_URL: http://backend:8000
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    command:
      [
        "streamlit",
        "run",
        "streamlit_app/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    ports:
      - "8502:8501"

  pgadmin:
    image: dpage/pgadmin4:8
    profiles:
      - dbadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./ops/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"

  model_server:
    build:
      context: .
      dockerfile: model_server/Dockerfile
    depends_on:
      vault:
        condition: service_healthy
      vault_seed:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chatbot:
    build:
      context: ./
    depends_on:
      backend:
        condition: service_started
    environment:
      MAINTAINER_COPILOT_UI_BASE_URL: http://backend:8000
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    command:
      [
        "streamlit",
        "run",
        "streamlit_app/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]
    ports:
      - "8501:8501"

  widget:
    build:
      context: ./widget
    ports:
      - "8082:80"

  demo_host:
    build:
      context: ./demo/host
    environment:
      BACKEND_URL: ${WIDGET_BACKEND_URL:-http://localhost:8000}
      WIDGET_ID: ${DEMO_WIDGET_ID:-YOUR_WIDGET_ID}
    ports:
      - "8080:80"
      - "8081:80"

volumes:
  pgadmin-data:
