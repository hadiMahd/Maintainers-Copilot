services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: maintainer
      POSTGRES_USER: maintainer
      POSTGRES_PASSWORD: maintainer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintainer"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"

  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8200:8200"

  migrations:
    build:
      context: ./
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://maintainer:maintainer@postgres:5432/maintainer
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "8000:8000"

  model_server:
    build:
      context: ./model_server
    profiles:
      - skeletal

  chatbot:
    build:
      context: ./chatbot
    profiles:
      - skeletal

  widget:
    build:
      context: ./widget
    profiles:
      - skeletal

  demo_host:
    build:
      context: ./demo/host
    profiles:
      - skeletal
